as_of: 27 November 2026, 02:02 Hong Kong time (Asia/Hong_Kong, UTC+8)
notes: Sourced map of online-safety, child-safety, platform, gaming and AI-service regulators, relevant
  ministries, official newsroom, bill and media-release pages, and named key spokespersons in the priority
  markets plus other markets evidenced in the instrument register or on official pages retrieved this
  run. This is not a claim to have mapped every regulator on earth. A spokesperson is listed only when
  an official page retrieved on 27 November 2026 named that person in the stated role. A personal or institutional
  X handle is listed only when that official page clearly identified the handle. Roster leads that could
  not be re-verified against a retrieved official page were left off. A 403, timeout or connection failure
  is not evidence that a page does not exist. Those official URLs are retained and remain scrape targets.
  Brand-mention watching is out of scope. Ministerial language such as 'becomes law' is not enactment.
