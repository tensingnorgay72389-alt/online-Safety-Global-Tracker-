version: 2026-11-27-legislature-sea
as_of: 27 November 2026, 02:50 Hong Kong time (Asia/Hong_Kong, UTC+8)
notes: Sourced map of online-safety, child-safety, platform, gaming and AI-service regulators, relevant
  ministries, official newsroom, bill and media-release pages, national legislatures (including houses
  of representatives and official bill and debate records) and named key spokespersons in the priority
  markets, all ASEAN member states, Timor-Leste where an official legislative source was retrieved, and
  EU institutions and sourced EU member-state bodies. This is not a claim to have mapped every regulator
  on earth. A spokesperson is listed only when an official page retrieved for this map named that person
  in the stated role. A personal or institutional X handle is listed only when that official page clearly
  identified the handle. Official legislative records (Hansard, congressional record, official debates
  and parliament newsrooms) are collected so that on-the-record member and minister comments can be reviewed.
  Those records are never auto-applied to the register. A 403, 429, 404, timeout or connection failure
  is not evidence that a page does not exist. Those official URLs are retained and remain scrape targets.
  Brand-mention watching is out of scope. Ministerial language such as 'becomes law' is not enactment.
  Weekday `ts-monitor run` requests official scrape targets whose jurisdiction is in the approved
  priority market set (ts_monitor.weekday_scope). The existing Timor-Leste legislative source stays
  on that run. Bodies outside the set remain in this map with their official URLs.
