# Curated official and news sources for Trust and Safety regulatory monitoring.
# A hit may be marked significant and auto-apply eligible only when the source is official
# and the classifier finds a qualifying instrument event. News sources are for discovery only.
# Ministerial media releases are official in origin but cannot be auto-applied on their own.

sources:
  # --- Australia (official) ---
  - id: au-parlinfo-ddoc
    name: Australia official bill homepage, Online Safety Amendment (Digital Duty of Care) Bill 2026 (r7553)
    url: "https://parlinfo.aph.gov.au/parlInfo/search/display/display.w3p;query=Id:legislation/billhome/r7553"
    method: official_page
    jurisdiction: AU
    official: true
    auto_apply_eligible: true
    role: instrument
    notes: Parser should record the official status field and whether Royal Assent is listed.

  - id: au-parlinfo
    name: Parliament of Australia ParlInfo
    url: https://parlinfo.aph.gov.au/
    method: html_index
    jurisdiction: AU
    official: true
    auto_apply_eligible: true
    role: instrument

  - id: au-legislation
    name: Federal Register of Legislation (Australia)
    url: https://www.legislation.gov.au/
    method: html_index
    jurisdiction: AU
    official: true
    auto_apply_eligible: true
    role: instrument

  - id: au-esafety-newsroom
    name: eSafety Commissioner newsroom
    url: https://www.esafety.gov.au/newsroom
    method: html_index
    jurisdiction: AU
    official: true
    auto_apply_eligible: true
    role: regulator_newsroom
    notes: Official regulator releases may record enforcement. Joint network statements without a binding instrument are not auto-applied.

  - id: au-minister-communications
    name: Minister for Communications media releases (infrastructure.gov.au)
    url: https://minister.infrastructure.gov.au/wells/media-release/australias-digital-duty-care-becomes-law
    method: official_page
    jurisdiction: AU
    official: true
    auto_apply_eligible: false
    role: ministerial_release
    notes: Ministerial language such as "becomes law" is not Royal Assent and must not be auto-applied alone.

