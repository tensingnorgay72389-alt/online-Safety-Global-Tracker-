# Frozen Global Trust and Safety Dashboard vocabularies.
# Use these labels exactly. Do not invent near-synonyms.
# Category assignment is analytical judgement. Names, dates and status are sourced facts.

status:
  - proposed
  - inactive
  - under_review
  - passed
  - implementation_period
  - effective
  - enforced
  - challenged
  - enjoined
  - repealed

