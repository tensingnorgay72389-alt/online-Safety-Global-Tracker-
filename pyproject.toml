[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-regulatory-monitor"
version = "0.1.0"
description = "Trust and Safety regulatory monitoring backend that classifies official and news items and emits typed register patches."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ts-regulatory-monitor contributors" },
]
dependencies = [
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ts-monitor = "ts_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
